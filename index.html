const ri=n=>Math.floor(Math.random()*n);

function wpick(items,weights){let s=0;weights.forEach(w=>s+=w);let r=Math.random()*s;
 for(let i=0;i<items.length;i++){r-=weights[i];if(r<0)return items[i];}return items[items.length-1];}

/* =========================================================
   SOUND (WebAudio 自前生成)
   ========================================================= */
let AC=null,bgmTimer=null,bgmStep=0,bgmKind='';
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}
 if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,t0,dur,type,vol,slide){const a=ac();const o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
 o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.02);}
function noise(t0,dur,vol,hp){const a=ac();const n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=a.createBufferSource();s.buffer=buf;const g=a.createGain(),f=a.createBiquadFilter();
 f.type='highpass';f.frequency.value=hp||800;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
 s.connect(f).connect(g).connect(a.destination);s.start(t0);}
const SE={
 launch(){if(!G.sound)return;const t=ac().currentTime;noise(t,.05,.05,2500);},
 pocket(){if(!G.sound)return;const t=ac().currentTime;tone(1320,t,.09,'square',.10);tone(1760,t+.07,.12,'square',.09);},
 den(){if(!G.sound)return;const t=ac().currentTime;tone(988,t,.1,'square',.11);tone(1319,t+.08,.14,'square',.1);},
 gate(){if(!G.sound)return;const t=ac().currentTime;tone(1400,t,.05,'square',.06);},
 stop(){if(!G.sound)return;const t=ac().currentTime;tone(300,t,.08,'square',.12,220);},
 reach(){if(!G.sound)return;const t=ac().currentTime;[660,880,1100].forEach((f,i)=>tone(f,t+i*.09,.14,'square',.12));},
 spup(){if(!G.sound)return;const t=ac().currentTime;for(let i=0;i<6;i++)tone(500+i*140,t+i*.05,.1,'sawtooth',.09);},
 bare(){if(!G.sound)return;const t=ac().currentTime;tone(1568,t,.3,'triangle',.2);tone(2093,t+.12,.35,'triangle',.18);},
 prem(){if(!G.sound)return;const t=ac().currentTime;[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,t+i*.07,.5,'triangle',.16));},
 win(){if(!G.sound)return;const t=ac().currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.11,.4,'square',.13));tone(1047,t+.5,.7,'square',.14);},
 lose(){if(!G.sound)return;const t=ac().currentTime;tone(220,t,.25,'triangle',.1,160);},
 atk(){if(!G.sound)return;const t=ac().currentTime;tone(880,t,.06,'square',.1,1200);},
 freeze(){if(!G.sound)return;const t=ac().currentTime;tone(60,t,.5,'sawtooth',.22,40);noise(t,.15,.12,300);},
 beat(){if(!G.sound)return;const t=ac().currentTime;tone(55,t,.2,'sine',.3,40);noise(t,.04,.05,200);},
};
const SCALE={
 normal:{bpm:112,bass:[147,0,147,0,175,0,131,0],mel:[440,523,440,392,349,392,440,0, 349,330,294,330,349,392,440,0]},
 rush:  {bpm:150,bass:[147,147,196,196,175,175,220,220],mel:[587,523,587,698,587,523,440,523, 587,698,784,698,587,523,587,0]},
 round: {bpm:132,bass:[131,0,165,0,196,0,165,0],mel:[523,659,784,659,523,659,784,1047, 784,659,523,659,784,659,523,0]},
};
function bgm(kind){
 if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
 bgmKind=kind;if(!kind||!G.sound)return;
 const p=SCALE[kind];bgmStep=0;
 const iv=60000/p.bpm/2;
 bgmTimer=setInterval(()=>{
   if(!G.sound)return;
   const t=ac().currentTime;
   const b=p.bass[bgmStep%p.bass.length];if(b)tone(b,t,.18,'triangle',.07);
   const m=p.mel[bgmStep%p.mel.length];if(m)tone(m,t,.14,'square',.045);
   bgmStep++;
 },iv);
}

/* =========================================================
   盤面ジオメトリ
   ========================================================= */
const BOARD={x0:22,y0:14,x1:458,y1:768};
const CIR={x:240,y:258,R:222};          // 上部円形壁 兼 レール
const RAIL_R=CIR.R-12;                   // 玉のレール走行半径
const RAIL_A0=Math.PI*166/180;           // レーン→円弧の接続角
const RAIL_END=Math.PI*334/180;          // 右振り切り角
const RAIL_JOIN_Y=309,RAIL_LANE_X=36;    // 発射レーン(左端)
const LCD={x:108,y:118,w:264,h:308};
const START={x:240,y:648,w:24};                     // ヘソ(蝙蝠・カップ挙動)
const GATE={x:424,y:200,w:48,h:22};                 // 右スルーゲート
const DEN={x:412,y:470,w:36,t:0};                   // 電チュー
const ATK={x:398,y:574,w:96,open:false};            // 右アタッカー(拡幅)
const WIND=[{x:150,y:250,a:2},{x:184,y:522,a:1},{x:334,y:474,a:3}]; // 風車(右ゾーン活性用に移設)
const ROTOR={x:84,y:468,r:13,a:0,hit:0};            // スピナー(左下・玉を乱舞ゾーンへ弾く)
const OTHER=[{x:314,y:606}];                        // 一般入賞口(+2玉・右ゾーン)
const WARP={x:88,y:302,r:5};                        // ワープ入口(左・低確率)
const VANE={x0:455,y0:264,x1:428,y1:308};           // クルーン誘導ベロ(RUSH変動中のみ開)
const AFIN={x0:455,y0:504,x1:426,y1:552};           // アタッカー誘導フィン(大当り中のみ開)
const FLAP={x0:389,y0:498,x1:391,y1:556};           // 振分けフラップ(右打ち時は開いて中央右ゾーンへ)
const STG={y:440,x0:172,x1:308,gap0:236,gap1:244};  // 液晶下ステージ
const KROON={x:413,y:330,r:26,busy:false,ready:false,charge:0}; // スカーレットクルーン(チャージ式)
const pegs=[],SEGS=[],DECO=[];
(function buildPegs(){
 const P=(x,y,r)=>pegs.push({x,y,r:r||4.5});
 const line=(x0,y0,x1,y1,sp)=>{
   const n=Math.round(Math.hypot(x1-x0,y1-y0)/sp);
   for(let i=0;i<=n;i++)P(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,4);
 };
 // 液晶の屋根(滑らかな淵・玉が引っかからない)。fr=屋根専用の強め転がり摩擦
 // (滑走が速すぎると端から側壁へ飛んで叩きつけられるため、端からほぼ真下に落とす)
 SEGS.push({x0:240,y0:66,x1:108,y1:104,fr:0.90});
 SEGS.push({x0:240,y0:66,x1:372,y1:104,fr:0.90});
 // 左フィールド散らし
 P(70,190);P(102,240);P(68,356);P(118,392);
 // 右チャンネル誘導(ゲート→電チュー→アタッカー)
 P(442,246);P(410,296);
 // 液晶下の散らし釘(中央はステージ落下ルートとして空ける)
 for(let r=0;r<2;r++){
   const y=456+r*34,off=(r%2)?21:0;
   for(let x=120+off;x<=360;x+=42){if(Math.abs(x-240)>=34)P(x,y);}
 }
 P(228,608);P(252,608); // 命釘(ヘソ上・絞り)
 for(let gy=494;gy<=566;gy+=12){P(224,gy,4);P(256,gy,4);} // 紅の門(密釘柱・横入り不可)
 // 乱舞ゾーン(ステージ両脇の散らし)
 P(196,500);
 P(322,498);P(306,536);P(292,572); // 右ゾーン戻し釘(着地はヘソ外)
 P(150,512);P(330,512);
 // 道釘 = 滑らかな坂(線分)+飾り釘。こぼし穴で玉が抜ける
 const road=(x0,y0,x1,y1,gaps)=>{
   const pts=[0,...gaps.flatMap(g=>[g-0.08,g+0.08]),1];
   for(let k=0;k<pts.length;k+=2){
     const a=pts[k],b2=pts[k+1];
     SEGS.push({x0:x0+(x1-x0)*a,y0:y0+(y1-y0)*a,x1:x0+(x1-x0)*b2,y1:y0+(y1-y0)*b2});
   }
   const n=Math.round(Math.hypot(x1-x0,y1-y0)/14);
   for(let i=0;i<=n;i++){
     if(gaps.some(g=>Math.abs(i/n-g)<0.08))continue;
     DECO.push({x:x0+(x1-x0)*i/n,y:y0+(y1-y0)*i/n,r:4});
   }
 };
road(40,544,214,634,[0.26,0.44,0.62,0.8]); // 左道釘(こぼし4箇所)
 road(394,584,432,624,[]);              // 右戻り傾斜(右打ち玉はアウトへ直行)
 road(334,558,266,634,[0.5]);           // 右側の道釘(中央から落ちた玉をヘソへ)
 SEGS.push({x0:374,y0:288,x1:389,y1:498}); // 右ルート仕切り壁(上半分・固定)
 SEGS.push({x0:391,y0:554,x1:394,y1:586}); // 仕切り下部スタブ(常時・隙間封鎖)
 SEGS.push({x0:46,y0:316,x1:46,y1:656});   // 内レール(発射レーンとフィールド分離)
})();
const balls=[];
function spawnBall(){
 if(G.balls<=0){G.autoFire=false;checkEmpty();return;}
 G.balls--;
 balls.push({rail:1,a:RAIL_A0,v:13.2+G.handle*3.1+rnd(-0.12,0.12),r:6,x:RAIL_LANE_X,y:748,vx:0,vy:0});
 SE.launch();
}
function physStep(){
 const g=0.16,rest=0.52,RAIL_FRIC=0.97;
 for(let i=balls.length-1;i>=0;i--){
  const b=balls[i];
  /* --- 発射レーン(左端を上昇) --- */
  if(b.rail===1){
    b.v-=g;
    b.y-=b.v;
    if(b.v<=0.4){b.rail=0;b.vx=rnd(-.1,.1);b.vy=0.2;} // ファール玉→そのまま落ちてアウト
    else if(b.y<=RAIL_JOIN_Y){b.rail=2;b.a=RAIL_A0;}
    else continue;
  }
  /* --- 外周レール(円弧) --- */
  if(b.rail===2){
    b.v+=g*Math.cos(b.a);
    if(b.v<4)b.v*=RAIL_FRIC; // 弱玉のみ転がり摩擦: 登りで力尽きて左肩から場内へ(頂点越え→右壁への加速激突を抑制)。右打ちの強玉(v≧6)は減衰させない
    b.a+=b.v/RAIL_R;
    b.x=CIR.x+RAIL_R*Math.cos(b.a);b.y=CIR.y+RAIL_R*Math.sin(b.a);
    if(b.v<=0.35||b.a>=RAIL_END){
      b.rail=0;
      b.vx=b.v*-Math.sin(b.a);b.vy=b.v*Math.cos(b.a);
      b.vx+=(b.x<CIR.x?1.2+rnd(0,0.9):-0.5); // レール端から場内へ飛び出す
    }else continue;
  }
  b.vy+=g;b.x+=b.vx;b.y+=b.vy;
  if(Math.abs(b.vx)+Math.abs(b.vy)<0.6){b.slow=(b.slow||0)+1;
   if(b.slow>18){
     if(b.y<140){b.vx+=((b.x<240?97:383)-b.x)*0.12;b.vy+=rnd(0.3,0.7);}
     else{b.vx+=rnd(-1.1,1.1);b.vy-=rnd(0.2,0.8);}
     b.slow=0;
   }}else b.slow=0;
  /* --- 上部円形壁 --- */
  if(b.y<CIR.y){
    const dx=b.x-CIR.x,dy=b.y-CIR.y,d=Math.hypot(dx,dy),lim=CIR.R-b.r;
    if(d>lim){
      const nx=dx/d,ny=dy/d;
      b.x=CIR.x+nx*lim;b.y=CIR.y+ny*lim;
      const dot=b.vx*nx+b.vy*ny;
      b.vx=(b.vx-2*dot*nx)*rest;b.vy=(b.vy-2*dot*ny)*rest;
    }
  }else{
    if(b.x<BOARD.x0+b.r){b.x=BOARD.x0+b.r;b.vx=Math.abs(b.vx)*rest;}
    if(b.x>BOARD.x1-b.r){b.x=BOARD.x1-b.r;b.vx=-Math.abs(b.vx)*rest;}
  }
  /* --- 液晶枠 --- */
  const L=LCD,ex=8;
  if(b.x>L.x-ex&&b.x<L.x+L.w+ex&&b.y>L.y-ex&&b.y<L.y+L.h+ex){
    const dl=b.x-(L.x-ex),dr=(L.x+L.w+ex)-b.x,dt=b.y-(L.y-ex),db=(L.y+L.h+ex)-b.y;
    const m=Math.min(dl,dr,dt,db);
    if(m===dl){b.x=L.x-ex;b.vx=-Math.abs(b.vx)*rest;}
    else if(m===dr){b.x=L.x+L.w+ex;b.vx=Math.abs(b.vx)*rest;}
    else if(m===dt){b.y=L.y-ex;b.vy=-Math.abs(b.vy)*rest-0.4;b.vx+=b.x<240?-0.3:0.3;}
    else{b.y=L.y+L.h+ex;b.vy=Math.abs(b.vy)*rest;}
  }
  /* --- 釘 --- */
  for(const p of pegs){
    const dx=b.x-p.x,dy=b.y-p.y,rr=b.r+p.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>0.0001){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=p.x+nx*rr;b.y=p.y+ny*rr;
      const dot=b.vx*nx+b.vy*ny;
      b.vx=(b.vx-2*dot*nx)*rest+rnd(-.35,.35);
      b.vy=(b.vy-2*dot*ny)*rest;
    }
  }
  /* --- ステージ上の玉(ワープ経由のみ) --- */
  if(b.stage){
    const mid=(STG.gap0+STG.gap1)/2;
    // 中央くぼみへ転がる
    b.vx+=(b.x<mid?0.028:-0.028);
    b.vx*=0.985;
    if(b.y>STG.y-b.r){b.y=STG.y-b.r;if(b.vy>0)b.vy=-b.vy*0.3;}
    if(b.x>STG.gap0&&b.x<STG.gap1&&Math.abs(b.vx)<0.9){
      b.stage=false;b.x=240+rnd(-9,9);b.vy=0.5;b.vx=rnd(-0.3,0.3); // 中央穴から(揺らぎ大)
    }else if(b.x<STG.x0||b.x>STG.x1){b.stage=false;}
  }
  /* --- ワープ入口 --- */
  if(!b.stage&&!b.warped&&b.vy>0){
    const wdx=b.x-WARP.x,wdy=b.y-WARP.y;
    if(wdx*wdx+wdy*wdy<WARP.r*WARP.r){
      b.warped=true; // 再判定なし
      if(Math.random()<0.20){
        b.stage=true;
        b.x=STG.x0+6;b.y=STG.y-b.r;b.vx=1.5;b.vy=0;
        SE.gate();
      }
    }
  }
  /* --- 道釘(坂) --- */
  for(const s2 of SEGS){
    const sdx=s2.x1-s2.x0,sdy=s2.y1-s2.y0,len2=sdx*sdx+sdy*sdy;
    let tt=((b.x-s2.x0)*sdx+(b.y-s2.y0)*sdy)/len2;tt=Math.max(0,Math.min(1,tt));
    const px=s2.x0+sdx*tt,py=s2.y0+sdy*tt;
    let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny);
    if(d<b.r+2&&d>0.001){
      nx/=d;ny/=d;
      b.x=px+nx*(b.r+2);b.y=py+ny*(b.r+2);
      const dot=b.vx*nx+b.vy*ny;
      if(dot<0){b.vx-=1.55*dot*nx;b.vy-=1.55*dot*ny;}
      // 転がり摩擦(速い玉がこぼしを飛び越えないように)。s2.frで個別指定可
      const fr2=s2.fr||0.955;
      const d2v=b.vx*nx+b.vy*ny;
      const tx=b.vx-d2v*nx,ty=b.vy-d2v*ny;
      b.vx=d2v*nx+tx*fr2;b.vy=d2v*ny+ty*fr2;
    }
  }
  /* --- スピナー(回転弾き役物) --- */
  {
    const dx=b.x-ROTOR.x,dy=b.y-ROTOR.y,rr=b.r+ROTOR.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>0.0001){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=ROTOR.x+nx*rr;b.y=ROTOR.y+ny*rr;
      b.vx=3.4+rnd(0,1.8);
      b.vy=-(1.6+rnd(0,1.6));
      ROTOR.hit=1;SE.atk();
    }
  }
  /* --- 風車 --- */
  for(const w of WIND){
    const dx=b.x-w.x,dy=b.y-w.y,rr=b.r+8,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>0.0001){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=w.x+nx*rr;b.y=w.y+ny*rr;
      const dot=b.vx*nx+b.vy*ny;
      b.vx=(b.vx-2*dot*nx)*rest-ny*1.1;
      b.vy=(b.vy-2*dot*ny)*rest+nx*1.1;
      w.hit=1;
    }
  }
  /* --- 振分けフラップ(通常時は閉=壁、右打ち時は右→左の一方通行) --- */
  if(!rightMode()||(b.vx>0&&b.x<FLAP.x0)){
    const fdx2=FLAP.x1-FLAP.x0,fdy2=FLAP.y1-FLAP.y0,fl22=fdx2*fdx2+fdy2*fdy2;
    let ft2=((b.x-FLAP.x0)*fdx2+(b.y-FLAP.y0)*fdy2)/fl22;ft2=Math.max(0,Math.min(1,ft2));
    const fpx2=FLAP.x0+fdx2*ft2,fpy2=FLAP.y0+fdy2*ft2;
    let fnx2=b.x-fpx2,fny2=b.y-fpy2;const fd2=Math.hypot(fnx2,fny2);
    if(fd2<b.r+2&&fd2>0.001){
      fnx2/=fd2;fny2/=fd2;
      b.x=fpx2+fnx2*(b.r+2);b.y=fpy2+fny2*(b.r+2);
      const fdot2=b.vx*fnx2+b.vy*fny2;
      if(fdot2<0){b.vx-=1.5*fdot2*fnx2;b.vy-=1.5*fdot2*fny2;}
    }
  }
  /* --- アタッカー誘導フィン(大当り中のみ) --- */
  if(ATK.open&&!b.kr){
    const fdx=AFIN.x1-AFIN.x0,fdy=AFIN.y1-AFIN.y0,fl2=fdx*fdx+fdy*fdy;
    let ft=((b.x-AFIN.x0)*fdx+(b.y-AFIN.y0)*fdy)/fl2;ft=Math.max(0,Math.min(1,ft));
    const fpx=AFIN.x0+fdx*ft,fpy=AFIN.y0+fdy*ft;
    let fnx=b.x-fpx,fny=b.y-fpy;const fd=Math.hypot(fnx,fny);
    if(fd<b.r+2&&fd>0.001){
      fnx/=fd;fny/=fd;
      b.x=fpx+fnx*(b.r+2);b.y=fpy+fny*(b.r+2);
      const fdot=b.vx*fnx+b.vy*fny;
      if(fdot<0){b.vx-=1.5*fdot*fnx;b.vy-=1.5*fdot*fny;}
    }
  }
  /* --- クルーン誘導ベロ(RUSH変動中のみ) --- */
  if(kroonActive()&&!KROON.busy&&!b.kr){
    const vdx=VANE.x1-VANE.x0,vdy=VANE.y1-VANE.y0,vl2=vdx*vdx+vdy*vdy;
    let vt=((b.x-VANE.x0)*vdx+(b.y-VANE.y0)*vdy)/vl2;vt=Math.max(0,Math.min(1,vt));
    const vpx=VANE.x0+vdx*vt,vpy=VANE.y0+vdy*vt;
    let vnx=b.x-vpx,vny=b.y-vpy;const vd=Math.hypot(vnx,vny);
    if(vd<b.r+2&&vd>0.001){
      vnx/=vd;vny/=vd;
      b.x=vpx+vnx*(b.r+2);b.y=vpy+vny*(b.r+2);
      const vdot=b.vx*vnx+b.vy*vny;
      if(vdot<0){b.vx-=1.5*vdot*vnx;b.vy-=1.5*vdot*vny;}
    }
  }
  /* --- スカーレットクルーン(右・V入賞) --- */
  if(b.kr){
    b.kr.t+=0.0084;
    const kt=b.kr.t;
    b.kr.a+=0.20*(1.7-kt);
    const kr2=Math.max(5,24*(1-kt/1.7));
    b.x=KROON.x+Math.cos(b.kr.a)*kr2;
    b.y=KROON.y+Math.sin(b.kr.a)*kr2*0.45;
    b.vx=0;b.vy=0;
    if(kt>=1.7){
      KROON.busy=false;KROON.ready=false;KROON.charge=0;
      const v=Math.random()<0.25; // 4穴中V穴1つ
      b.kr=null;b.x=KROON.x;b.y=KROON.y+16;b.vy=1.2;
      if(v){
        SE.prem();G.vFx=1.6;G.flash=.95;G.flashCol='#ffd24d';G.shake=0.7;
        G.vCount=(G.vCount||0)+1;
        if((G.vStock||0)<1){G.vStock=1;G.balls+=5;}
        else{G.balls+=10;} // ストック保持中は賞球のみ
      }
    }
    continue;
  }
  if(!b.kr&&kroonActive()&&!KROON.busy&&!b.krDone&&b.vy>0){
    const kdx=b.x-KROON.x,kdy=b.y-KROON.y;
    if(kdx*kdx+kdy*kdy<(KROON.r-10)*(KROON.r-10)){
      b.kr={t:0,a:Math.atan2(kdy,kdx)};b.krDone=true;KROON.busy=true;SE.gate();
    }
  }else if(!b.kr&&(!kroonActive()||KROON.busy)){
    // 蓋closed: ドームとして弾く
    const kdx=b.x-KROON.x,kdy=b.y-KROON.y,krr=b.r+KROON.r-4,kd2=kdx*kdx+kdy*kdy;
    if(kd2<krr*krr&&kd2>0.0001){
      const kd=Math.sqrt(kd2),knx=kdx/kd,kny=kdy/kd;
      b.x=KROON.x+knx*krr;b.y=KROON.y+kny*krr;
      const kdot=b.vx*knx+b.vy*kny;
      if(kdot<0){b.vx=(b.vx-2*kdot*knx)*0.5;b.vy=(b.vy-2*kdot*kny)*0.5;}
    }
  }
  /* --- スルーゲート(通過) --- */
  if(!b.gated&&b.x>GATE.x-GATE.w/2&&b.x<GATE.x+GATE.w/2&&b.y>GATE.y&&b.y<GATE.y+GATE.h){
    b.gated=true;onGate();
  }
  /* --- 電チュー --- */
  if(DEN.t>0){
    if(Math.abs(b.x-DEN.x)<DEN.w/2&&b.y>DEN.y-6&&b.y<DEN.y+14&&b.vy>0){
      balls.splice(i,1);G.balls+=PRIZE_DEN;SE.den();onStartIn();continue;
    }
  }else{
    const dx=b.x-DEN.x,dy=b.y-DEN.y,rr=b.r+6,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>0.0001){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=DEN.x+nx*rr;b.y=DEN.y+ny*rr;
      const dot=b.vx*nx+b.vy*ny;
      b.vx=(b.vx-2*dot*nx)*rest;b.vy=(b.vy-2*dot*ny)*rest;
    }
  }
  /* --- アタッカー(右) --- */
  if(ATK.open&&Math.abs(b.x-ATK.x)<ATK.w/2&&b.y>ATK.y-6&&b.y<ATK.y+16&&b.vy>0){
    balls.splice(i,1);G.balls+=PRIZE_ATK;G.roundIn=(G.roundIn||0)+1;SE.atk();continue;
  }
  /* --- 一般入賞口 --- */
  let caught=false;
  for(const o of OTHER){
    if(Math.abs(b.x-o.x)<11&&b.y>o.y-4&&b.y<o.y+12&&b.vy>0){
      balls.splice(i,1);G.balls+=2;SE.pocket();caught=true;break;
    }
  }
  if(caught)continue;
  /* --- 紅の門 通過検知 --- */
  if(!b.gateFxDone&&Math.abs(b.x-240)<16&&b.y>526&&b.y<552&&b.vy>0){
    b.gateFxDone=true;G.gateFx=1;
  }
  /* --- ヘソ(蝙蝠) --- */
  if(Math.abs(b.x-START.x)<START.w/2+9&&b.y>START.y-8&&b.y<START.y+12&&b.vy>0&&
     !(Math.abs(b.vx)<1.0&&Math.abs(b.x-START.x)<START.w/2)){
    // 速い玉/端の玉はヘソのフチでバウンドして素通り
    b.y=START.y-8;
    b.vy=-Math.abs(b.vy)*0.45-0.5;
    if(Math.abs(b.x-START.x)>=START.w/2){b.vx=(b.x<START.x?-1:1)*(1.3+Math.abs(b.vx)*0.4);} // 端はフチ外へ滑落
    else b.vx*=0.9;
    G.batFlap=0.4;
  }
  if(Math.abs(b.x-START.x)<START.w/2&&b.y>START.y-6&&b.y<START.y+12&&b.vy>0&&Math.abs(b.vx)<1.0){
    balls.splice(i,1);G.balls+=PRIZE_START;SE.pocket();G.batFlap=1;onStartIn();continue;
  }
  if(b.y>BOARD.y1+10){balls.splice(i,1);continue;}
 }
}

 SE.gate();
 if(G.rush&&G.lcd.phase!=='round'){DEN.t=2.2;}

function rightMode(){return G.rush||G.lcd.phase==='round'||G.lcd.phase==='rushIn';}
function kroonRushPhase(){return G.rush&&(G.lcd.phase==='idle'||G.lcd.phase==='spin'||G.lcd.phase==='judge');}

 const hit=ri(odds)===0;

   e.doppel=e.pattern!=='zen'&&Math.random()<0.05;
   e.trigger=Math.random()<0.30;
   e.revive=(e.pattern==='sp'||e.pattern==='spsp')&&Math.random()<0.08;
   e.prem=Math.random()<0.08?'art':(Math.random()<0.012?'tenko':null);
   e.bare=Math.random()<0.25?(Math.random()<0.2?'gold':'norm'):null;
   e.color=wpick(['#fff','#3af','#3f6','#f33','#fd0','rainbow'],[25,20,20,22,10,3]);
 }else{
   e.sym=ri(9);

   e.spStyle=ri(3);
   e.pseudo=(e.pattern==='sp'||e.pattern==='spsp')?wpick([0,1,2],[62,30,8]):0;
   e.freeze=e.pattern!=='quick'&&Math.random()<0.004;
   e.kessen=e.pattern==='spsp'&&Math.random()<0.08;
   e.bigbat=e.pattern!=='quick'&&Math.random()<0.06;
   e.gacha=(e.pattern!=='quick'&&Math.random()<0.25)?(Math.random()<0.08?'gold':'silver'):null;
   e.f495=(e.pattern!=='quick'&&Math.random()<0.005)?'495':null;
   e.doppel=Math.random()<0.002;
   e.trigger=e.pattern!=='quick'&&Math.random()<0.02;
   e.revive=false;
   e.prem=null;

   e.color=wpick(['#fff','#3af','#3f6','#f33'],[86,9,4,1]);
 }
 G.queue.push(e);

function startSpin(e){

 if(G.rush)G.rushRemain--;

 const s=e.sym;

function updateLCD(dt){
 lcd.t+=dt;
 const e=lcd.cur,tl=lcd.tl;
 switch(lcd.phase){
  case 'idle':
    if(G.rush&&G.rushRemain<=0){endRush();}
    else if(G.queue.length>0){startSpin(G.queue.shift());}
    break;
  case 'spin':{
    lcd.reel.forEach(r=>{if(!r.stop)r.pos=(r.pos+r.spd*dt*60)%9;});
    if(e.freeze){
      if(!lcd.fz1&&lcd.t>=0.15){lcd.fz1=true;SE.freeze();}
      if(!lcd.fz2&&lcd.t>=2.3){lcd.fz2=true;SE.prem();G.flash=1;G.flashCol='#ffd24d';G.shake=0.9;}
    }
    if(e.doppel&&!lcd.dopShown&&lcd.t>=0.35){lcd.dopShown=true;lcd.pushWait=true;lcd.pushKind='doppel';lcd.pushT=lcd.t;}
    if(tl.sp&&lcd.spFlag&&!lcd.pushShown&&lcd.t>=tl.stopM-(e.pattern==='spsp'?3.6:1.9)){lcd.pushShown=true;lcd.pushWait=true;lcd.pushKind='reveal';lcd.pushT=lcd.t;}

      lcd.pushWait=false;lcd.pushed=false;
      if(lcd.pushKind==='doppel'){
        if(e.hit&&e.doppel){lcd.dopFx=1.6;SE.prem();G.flash=.9;G.flashCol='#b45cff';G.shake=0.8;}
        else SE.stop();
      }else{
        lcd.pushFx=0.9;
        if(e.hit){SE.prem();G.flash=.8;G.flashCol='#ffd24d';}else{SE.stop();}
      }
    }
    if(lcd.pseudoStops)for(const ps of lcd.pseudoStops){
      if(!ps.p1&&lcd.t>=ps.t){ps.p1=true;SE.stop();}
      if(!ps.p2&&lcd.t>=ps.t+0.55){ps.p2=true;lcd.pseudoFx=0.9;SE.spup();G.shake=0.4;}
    }
    if(!lcd.reel[0].stop&&lcd.t>=tl.stopL){stopReel(0,lcd.fin[0]);}
    if(!lcd.reel[2].stop&&lcd.t>=tl.stopR){stopReel(2,lcd.fin[2]);}
    if(tl.reach&&!lcd.reachFlag&&lcd.t>=tl.reach){lcd.reachFlag=true;SE.reach();G.shake=0.35;}
    // 当落タメ: 中リールをコマ送り減速(実機の「ゆっくり通過」)
    if(tl.stopM&&lcd.reachFlag&&!lcd.reel[1].stop){
      const rm=lcd.reel[1];
      if(!lcd.crawl&&lcd.t>=tl.stopM-1.6){
        lcd.crawl=true;
        rm.spd=0.0125;
        rm.pos=((lcd.fin[1]-1.35)%9+9)%9;
      }
      if(lcd.crawl){
        const fl=Math.floor(rm.pos);
        if(fl!==lcd.crawlTick){lcd.crawlTick=fl;SE.stop();G.shake=Math.max(G.shake,0.15);}
      }
    }
    if(tl.sp&&!lcd.spFlag&&lcd.t>=tl.sp){lcd.spFlag=true;SE.spup();G.shake=0.5;
      if(e.prem&&!lcd.premShown){lcd.premShown=true;showPrem(e);}}
    if(tl.spsp&&!lcd.spspFlag&&lcd.t>=tl.spsp){lcd.spspFlag=true;SE.spup();G.flash=0.6;G.flashCol='#f24';G.shake=0.8;
      lcd.beatIv=0.8;lcd.nextBeat=lcd.t+0.2;}
    if(lcd.spspFlag&&lcd.nextBeat&&lcd.t>=lcd.nextBeat&&lcd.t<tl.spsp+3.1){
      SE.beat();G.shake=Math.max(G.shake,0.3);
      lcd.beatIv=Math.max(0.16,lcd.beatIv*0.85);
      lcd.nextBeat=lcd.t+lcd.beatIv;
    }
    if(tl.zen&&!lcd.zenFlag&&lcd.t>=tl.zen){lcd.zenFlag=true;SE.prem();
      lcd.reel.forEach(r=>{r.stop=false;r.spd=0.06;r.pos=lcd.fin[0]-1.5;});}
    if(!lcd.reel[1].stop&&lcd.t>=tl.stopM){
      stopReel(1,lcd.fin[1]);
      if(e.pattern==='zen'){lcd.reel[0].stop=true;lcd.reel[0].pos=lcd.fin[0];lcd.reel[2].stop=true;lcd.reel[2].pos=lcd.fin[2];}
      lcd.phase='judge';lcd.t=0;
    }
    break;}
  case 'judge':
    if(lcd.t>(e.hit?2.3:(lcd.resultLine?1.9:1.1))){
      if(e.hit){
        if(e.revive&&!e.revived){lcd.phase='revive';lcd.t=0;SE.reach();}

      else{SE.lose();lcd.phase='idle';lcd.t=0;hideTenko();checkEmpty();}

  case 'revive':

      e.revived=true;

}

function drawBigSym(s,x,y,sc,alpha,glow){
 ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));
 const pseudo=(s.n===''); // 擬似連図柄(紫大妖精)
 const im=IMGS[s.key];    // 全身立ち絵(丸窓・魔法陣リングは廃止)
 const bh=118*sc;         // 立ち絵の高さ目安
 // 当り=背後の柔らかい光彩(オーラ) / 擬似連=紫アクセント
 if(glow){
   const gg=ctx.createRadialGradient(x,y,4*sc,x,y,68*sc);
   gg.addColorStop(0,'rgba(255,232,150,.55)');gg.addColorStop(.55,'rgba(255,176,86,.26)');gg.addColorStop(1,'rgba(255,150,80,0)');
   ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,68*sc,0,7);ctx.fill();
 }else if(pseudo){
   const gg=ctx.createRadialGradient(x,y,4*sc,x,y,56*sc);
   gg.addColorStop(0,'rgba(180,92,255,.42)');gg.addColorStop(1,'rgba(180,92,255,0)');
   ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,56*sc,0,7);ctx.fill();
 }
 // 全身立ち絵(アスペクト比維持)
 if(im&&im.complete&&im.naturalWidth){
   const w=bh*im.naturalWidth/im.naturalHeight;
   ctx.drawImage(im,x-w/2,y-bh/2,w,bh);
 }
 // 擬似連は紫の縁光のみ、数字なし
 if(pseudo){
   ctx.strokeStyle='rgba(180,92,255,.7)';ctx.lineWidth=2*sc;
   ctx.beginPath();ctx.arc(x,y,52*sc,0,7);ctx.stroke();
   ctx.restore();return;
 }
 // 数字=立ち絵下部に大きく重ねる(視認性最優先)
 const fs=Math.round(44*sc),ny=y+bh/2-4*sc;
 ctx.font='bold '+fs+'px serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ctx.lineJoin='round';ctx.lineWidth=6.5*sc;ctx.strokeStyle='rgba(24,0,10,.96)';
 ctx.strokeText(s.n,x,ny);
 const gr=ctx.createLinearGradient(0,ny-fs,0,ny);
 if(glow){gr.addColorStop(0,'#fff6cf');gr.addColorStop(1,'#ffce3c');}
 else if(s.tier>=3){gr.addColorStop(0,'#ff9d9d');gr.addColorStop(1,'#c01838');}
 else if(s.tier===2){gr.addColorStop(0,'#e0b0ff');gr.addColorStop(1,'#7030b0');}
 else{gr.addColorStop(0,'#ffd9df');gr.addColorStop(1,'#c04058');}
 ctx.fillStyle=gr;ctx.fillText(s.n,x,ny);
 ctx.restore();
}
function drawReels(){
 const L=LCD;
 const sc=G.rush?0.78:1;
 const cy=L.y+(G.rush?L.h/2-40:L.h/2-4);
 const dx=84*sc;
 let frz=null;
 if(lcd.phase==='spin'&&lcd.pseudoStops){
   for(const ps of lcd.pseudoStops)if(lcd.t>=ps.t&&lcd.t<ps.t+0.55)frz=ps.combo;
 }
 const e=lcd.cur;
 const hit=lcd.phase==='judge'&&e&&e.hit&&(!e.revive||e.revived);
 for(let i=0;i<3;i++){
  const cx=L.x+L.w/2+(i-1)*dx;
  const r=lcd.reel[i];
  if(frz){
    const so=frz[i]==='P'?PSEUDO_SYM:SYM[frz[i]];
    drawBigSym(so,cx,cy,sc,1,false);
  }else if(r.stop){
    let s2=sc;
    if(lcd.phase==='spin'&&lcd.reachFlag&&i!==1)s2=sc*(1+0.06*Math.sin(performance.now()/130));
    drawBigSym(SYM[((Math.round(r.pos))%9+9)%9],cx,cy,s2,1,hit);
  }else{
    for(let k=-1;k<=1;k++){
      const idx=((Math.floor(r.pos)+k)%9+9)%9;
      const frac=r.pos-Math.floor(r.pos);
      const yy=cy+(k-frac)*95*sc;
      const a=Math.max(0,1-Math.abs(yy-cy)/(95*sc))*.9;
      if(a>0.05)drawBigSym(SYM[idx],cx,yy,sc*.92,a,false);
    }
  }
 }
}

 // 発射トグル
 const on=G.autoFire;
 const fg=ctx.createLinearGradient(0,FIREBTN.y,0,FIREBTN.y+FIREBTN.h);
 if(on){fg.addColorStop(0,'#ff5573');fg.addColorStop(1,'#a3122f');}
 else{fg.addColorStop(0,'#5a0a18');fg.addColorStop(1,'#33060f');}
 ctx.fillStyle=fg;
 roundRect(FIREBTN.x,FIREBTN.y,FIREBTN.w,FIREBTN.h,10);ctx.fill();
 ctx.strokeStyle=on?'#ffd24d':'#ff8fa3';ctx.lineWidth=2;
 roundRect(FIREBTN.x,FIREBTN.y,FIREBTN.w,FIREBTN.h,10);ctx.stroke();
 ctx.fillStyle='#ffe3e8';ctx.font='bold 16px sans-serif';ctx.textAlign='center';
 ctx.fillText(on?'発射中■':'発射▶',FIREBTN.x+FIREBTN.w/2,FIREBTN.y+27);
 // 左右打ち状態ランプ(ゲーム要求= rightMode)
 const rm=rightMode();
 ctx.fillStyle='#2c0712';roundRect(LAMP.x,LAMP.y,LAMP.w,LAMP.h,8);ctx.fill();
 ctx.strokeStyle='#5a0f1e';ctx.lineWidth=1;roundRect(LAMP.x,LAMP.y,LAMP.w,LAMP.h,8);ctx.stroke();
 const bl=.55+.45*Math.sin(performance.now()/300);
 ctx.textAlign='left';ctx.font='bold 12px sans-serif';ctx.textBaseline='alphabetic';
 ctx.globalAlpha=rm?0.25:bl;ctx.fillStyle='#ff8fa3';
 ctx.beginPath();ctx.arc(LAMP.x+14,LAMP.y+15,5,0,7);ctx.fill();
 ctx.globalAlpha=1;ctx.fillStyle=rm?'#6a4048':'#ffd9df';ctx.fillText('◀左打ち',LAMP.x+24,LAMP.y+19);
 ctx.globalAlpha=rm?bl:0.25;ctx.fillStyle='#ffd24d';
 ctx.beginPath();ctx.arc(LAMP.x+80,LAMP.y+15,5,0,7);ctx.fill();
 ctx.globalAlpha=1;ctx.fillStyle=rm?'#ffd24d':'#6a4048';ctx.fillText('右打ち▶',LAMP.x+90,LAMP.y+19);
 // 実機風回転ハンドル
 drawHandle();
 // 音
 ctx.font='bold 11px sans-serif';ctx.fillStyle=G.sound?'#ff8fa3':'#6a3a44';ctx.textAlign='center';
 ctx.fillText(G.sound?'♪ON':'♪OFF',SNDBTN.x+SNDBTN.w/2,SNDBTN.y+15);
 ctx.strokeStyle='#7a1226';ctx.lineWidth=1;roundRect(SNDBTN.x,SNDBTN.y,SNDBTN.w,SNDBTN.h,5);ctx.stroke();
 // 玉購入
 ctx.fillStyle='#3a2408';roundRect(BUYBTN.x,BUYBTN.y,BUYBTN.w,BUYBTN.h,5);ctx.fill();
 ctx.strokeStyle='#ffd24d';roundRect(BUYBTN.x,BUYBTN.y,BUYBTN.w,BUYBTN.h,5);ctx.stroke();
 ctx.fillStyle='#ffd24d';ctx.font='bold 10px sans-serif';
 ctx.fillText('+1000玉',BUYBTN.x+BUYBTN.w/2,BUYBTN.y+14);
 // 終了(2度押し確認)
 const armed=performance.now()-G.endArm<2000;
 ctx.fillStyle=armed?'#7a1226':'#2a0712';roundRect(ENDBTN.x,ENDBTN.y,ENDBTN.w,ENDBTN.h,5);ctx.fill();
 ctx.strokeStyle=armed?'#ff5573':'#8a4a58';roundRect(ENDBTN.x,ENDBTN.y,ENDBTN.w,ENDBTN.h,5);ctx.stroke();
 ctx.fillStyle=armed?'#ffd9df':'#c98a99';ctx.font='bold 10px sans-serif';
 ctx.fillText(armed?'確認?':'終了',ENDBTN.x+ENDBTN.w/2,ENDBTN.y+14);
}

/* =========================================================
   入力
   ========================================================= */
function toLocal(ev){
 const r=stage.getBoundingClientRect();
 const sc=r.width/W;
 const p=(ev.touches&&ev.touches[0])||(ev.changedTouches&&ev.changedTouches[0])||ev;
 return {x:(p.clientX-r.left)/sc,y:(p.clientY-r.top)/sc};
}
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function press(ev){
 if(G.scene!=='play')return;
 ac();
 const p=toLocal(ev);
 if(lcd.pushWait&&p.x>LCD.x&&p.x<LCD.x+LCD.w&&p.y>LCD.y&&p.y<LCD.y+LCD.h){lcd.pushed=true;return;}
 if(inRect(p,SNDBTN)){G.sound=!G.sound;if(!G.sound)bgm('');else bgm(G.rush?'rush':G.lcd.phase==='round'?'round':'normal');return;}
 if(inRect(p,BUYBTN)){G.balls+=1000;G.buyCount++;SE.pocket();return;}
 if(inRect(p,ENDBTN)){
   if(performance.now()-G.endArm<2000){showResult();}
   else G.endArm=performance.now();
   return;
 }
 if(inRect(p,FIREBTN)){G.autoFire=!G.autoFire;return;}
 const hdx=p.x-HANDLE.cx,hdy=p.y-HANDLE.cy; // ハンドルは見た目より一回り広く判定
 if(hdx*hdx+hdy*hdy<=(HANDLE.r+14)*(HANDLE.r+14)){G.dragging=true;moveHandle(p);ev.preventDefault&&ev.preventDefault();return;}
}
function move(ev){
 if(!G.dragging)return;
 moveHandle(toLocal(ev));
 ev.preventDefault&&ev.preventDefault();
}
function moveHandle(p){
 const t=(Math.atan2(p.y-HANDLE.cy,p.x-HANDLE.cx)-H_A0)/H_SWEEP;
 G.handle=t>1.75?0:Math.max(0,Math.min(1,t)); // 左下=巻き戻り域は0(左止まり)扱い
}
function release(){G.dragging=false;}
addEventListener('mousedown',press);addEventListener('mousemove',move);addEventListener('mouseup',release);
addEventListener('touchstart',press,{passive:false});addEventListener('touchmove',move,{passive:false});addEventListener('touchend',release);

/* =========================================================
   メインループ
   ========================================================= */
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G.scene==='play'){
  if(G.autoFire){G.fireT+=dt;if(G.fireT>0.40){G.fireT=0;spawnBall();}}
  if(DEN.t>0)DEN.t-=dt;
  if(kroonRushPhase()&&!KROON.busy&&!KROON.ready&&(G.vStock||0)===0){
    KROON.charge+=dt;
    if(KROON.charge>=40){KROON.ready=true;SE.gate();}
  }
  physStep();physStep();
  updateLCD(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.6);
  if(lcd.pseudoFx>0)lcd.pseudoFx=Math.max(0,lcd.pseudoFx-dt*1.3);
  if(lcd.pushFx>0)lcd.pushFx=Math.max(0,lcd.pushFx-dt*1.2);
  if(lcd.dopFx>0)lcd.dopFx=Math.max(0,lcd.dopFx-dt*0.8);
  if(G.gateFx>0)G.gateFx=Math.max(0,G.gateFx-dt*2.2);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.4);
  draw();
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- menu ---------- */
document.querySelectorAll('.specbtn').forEach(b=>{
 b.onclick=()=>{
   G.spec=+b.dataset.spec;
   document.getElementById('menu').style.display='none';
   G.scene='play';
   ac();bgm('normal');
 };
});
